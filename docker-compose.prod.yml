# ===========================================
# PRODUCTION DOCKER COMPOSE с Let's Encrypt
# ===========================================

services:
  # ===========================================
  # DATABASE
  # ===========================================
  postgres:
    image: postgres:17-alpine
    container_name: copy-paste-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-copypaste}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-copypaste}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # ===========================================
  # MIGRATIONS
  # ===========================================
  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrations
    container_name: copy-paste-migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-copypaste}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  # ===========================================
  # BACKEND API
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: copy-paste-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      BASE_URL: https://${DOMAIN}
      NOTE_TTL_HOURS: "3"
      CLEANUP_INTERVAL_MINUTES: "5"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-copypaste}
      DB_SSLMODE: disable
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cpp-backend.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/swagger`))"
      - "traefik.http.routers.cpp-backend.entrypoints=websecure"
      - "traefik.http.routers.cpp-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cpp-backend.priority=2"
      - "traefik.http.services.cpp-backend.loadbalancer.server.port=8080"
    networks:
      - web
      - internal

  # ===========================================
  # FRONTEND
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}
        VITE_APP_URL: https://${DOMAIN}
    container_name: copy-paste-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cpp-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.cpp-frontend.entrypoints=websecure"
      - "traefik.http.routers.cpp-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cpp-frontend.priority=1"
      - "traefik.http.services.cpp-frontend.loadbalancer.server.port=80"
    networks:
      - web

networks:
  web:
    external: true
  internal:
    name: internal

volumes:
  postgres_data:
